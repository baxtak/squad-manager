<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Squad Manager ⚽</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a1a;min-height:100vh}
.app{max-width:720px;margin:0 auto;padding:1.5rem 1rem}
h2{font-size:20px;font-weight:600;margin-bottom:6px}
h3{font-size:16px;font-weight:600;margin-bottom:10px}
.muted{font-size:13px;color:#666;line-height:1.6;margin-bottom:1rem}
.tabs{display:flex;border-bottom:1px solid #e0e0e0;margin-bottom:1.25rem;flex-wrap:wrap;background:#fff;border-radius:12px 12px 0 0;padding:0 8px}
.tab{padding:10px 12px;font-size:12px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a;font-weight:600}
.section{display:none}.section.active{display:block}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#1a1a1a;font-family:inherit}
.btn:hover{background:#f5f5f5}
.btn:active{transform:scale(.98)}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{background:#333;border-color:#333}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
input[type=text],input[type=number],input[type=password],input[type=date]{padding:8px 11px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-size:13px;font-family:inherit;width:100%}
input[type=range]{width:100%;accent-color:#1a1a1a}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem;margin-bottom:1rem}
.divider{height:1px;background:#f0f0f0;margin:1.25rem 0}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#f0f0f0;color:#666}
.skill-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.skill-label{font-size:12px;color:#666;width:88px;flex-shrink:0}
.skill-val{font-size:12px;font-weight:600;width:16px;text-align:right}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:1rem}
.pcard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem}
.tdisplay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:1rem 0}
.tcard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem}
.tlabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.tpr{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.tpr:last-child{border-bottom:none}
.bar-bg{height:5px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin:5px 0}
.bar-fill{height:100%;border-radius:3px}
.hcard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem;margin-bottom:10px}
.motm-btn{padding:4px 10px;font-size:12px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#666;font-family:inherit}
.motm-btn.voted{background:#FAEEDA;color:#633806;border-color:#EF9F27}
.fmt-btn{padding:7px 16px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;color:#666;font-family:inherit}
.fmt-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.avrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.avrow:last-child{border-bottom:none}
.srow{display:flex;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px solid #f0f0f0;gap:8px}
.srow:last-child{border-bottom:none}
.pos-list{display:flex;flex-direction:column;gap:4px;margin:6px 0 12px}
.pos-item{display:flex;align-items:center;gap:8px;background:#f8f8f6;border-radius:8px;padding:7px 10px}
.parr{padding:3px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:#666;line-height:1.4;font-family:inherit}
.parr:hover{background:#f5f5f5}
.parr:disabled{opacity:.25;cursor:default}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.lb-row:last-child{border-bottom:none}
.pin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#f8f8f6;border-radius:8px;margin-bottom:6px;font-size:13px}
.pin-val{font-family:monospace;font-weight:600;font-size:15px;letter-spacing:.12em}
.center-wrap{max-width:360px;margin:3rem auto;text-align:center}
.big-input{width:100%;text-align:center;font-size:24px;letter-spacing:.2em;margin:.75rem 0;padding:13px;border-radius:10px}
.style-tag-btn{display:inline-block;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid #ddd;color:#666;cursor:pointer;background:#fff;margin:3px;user-select:none;font-family:inherit}
.style-tag-btn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.db-pill{font-size:11px;padding:3px 9px;border-radius:999px;margin-left:8px;font-weight:500}
.db-ok{background:#e1f5ee;color:#0f6e56}
.db-err{background:#fce8e8;color:#a32d2d}
.screen-loading{text-align:center;padding:4rem 0}
.player-selector{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.player-sel-btn{padding:5px 12px;font-size:12px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#666;font-family:inherit}
.player-sel-btn.t1{background:#e6f1fb;color:#185FA5;border-color:#85B7EB}
.player-sel-btn.t2{background:#e1f5ee;color:#0F6E56;border-color:#5DCAA5}
.player-sel-btn.sub{background:#faeeda;color:#633806;border-color:#EF9F27}
@media(max-width:480px){.tdisplay{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="screen-loading" class="screen-loading">
    <div style="font-size:40px;margin-bottom:1rem">⚽</div>
    <div style="font-size:14px;color:#666">Connecting to database...</div>
  </div>
  <div id="screen-setup" style="display:none">
    <div class="center-wrap">
      <div style="font-size:40px;margin-bottom:.75rem">⚽</div>
      <h2>Welcome to Squad manager</h2>
      <p class="muted" style="margin-top:6px">First time setup. Create your admin PIN — only you will know this.</p>
      <input type="password" class="big-input" id="setup-pin1" placeholder="Choose PIN" maxlength="8"/>
      <input type="password" class="big-input" id="setup-pin2" placeholder="Confirm PIN" maxlength="8"/>
      <div id="setup-err" style="font-size:12px;color:#c0392b;min-height:18px;margin-bottom:12px"></div>
      <button class="btn btn-primary" style="width:100%;padding:12px" onclick="setupPin()">Create PIN &amp; get started</button>
    </div>
  </div>
  <div id="screen-login" style="display:none">
    <div class="center-wrap">
      <div style="font-size:40px;margin-bottom:.75rem">⚽</div>
      <h2>Squad manager</h2>
      <p class="muted" style="margin-top:6px">Enter your PIN to continue.</p>
      <input type="password" class="big-input" id="login-pin" placeholder="••••" maxlength="8" oninput="tryLogin(this.value)"/>
      <div id="login-err" style="font-size:12px;color:#c0392b;min-height:18px;margin-bottom:12px"></div>
      <button class="btn" style="width:100%;padding:10px;margin-top:4px" onclick="guestLogin()">Continue as guest (view only)</button>
    </div>
  </div>
  <div id="screen-main" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-size:22px;font-weight:700">⚽ Squad manager</div>
        <span id="db-indicator" class="db-pill db-ok">● live</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="user-badge" class="badge"></span>
        <button class="btn btn-sm" onclick="logout()">Log out</button>
      </div>
    </div>
    <div class="tabs" id="main-tabs"></div>
    <div id="tab-squad" class="section"></div>
    <div id="tab-session" class="section"></div>
    <div id="tab-teams" class="section"></div>
    <div id="tab-rate" class="section"></div>
    <div id="tab-history" class="section"></div>
    <div id="tab-leaderboard" class="section"></div>
    <div id="tab-admin" class="section"></div>
  </div>
</div>
<script>
const SUPABASE_URL='https://zgeuhhbwfvkevnuroyjy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnZXVoaGJ3ZnZrZXZudXJveWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MzM2MjksImV4cCI6MjA5NDUwOTYyOX0.CKVUGxnW7G4iT53qkBb9Zj5WP7tNHpIfD-MFSM3CMbk';
const SKILLS=['Pace','Strength','Defending','Passing','Shooting','Dribbling','Positioning','Work rate','Leadership'];
const POSITIONS=[{key:'DEF',desc:'Stays back, defends'},{key:'MID',desc:'Links play, box to box'},{key:'WNG',desc:'Wide, stretches the game'},{key:'FWD',desc:'Attacks, presses high'}];
const STYLE_TAGS=['Wide','Central','Carrier','Distributor','Press','Hold shape','Box to box','Clinical'];
const ACOLS=['#378ADD','#1D9E75','#D85A30','#D4537E','#BA7517','#534AB7','#639922','#888780','#185FA5','#0F6E56','#993C1D','#993556'];
let players=[],history=[],peerRatings={},config={adminPin:'',playerPins:{}};
let available=new Set(),gameFormat=5,pendingTeams=null;
let currentUser=null,currentRole=null,editingIdx=null,editPosOrder=POSITIONS.map(p=>p.key);
let selectedTags=[];
let manualT1=new Set(),manualT2=new Set(),manualSubs=new Set();

function initials(n){return(n||'').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function genPin(){return String(Math.floor(1000+Math.random()*9000))}
function playerOverall(p){const base=SKILLS.reduce((s,k)=>s+(p.skills[k]||5),0)/SKILLS.length;const r=getPeerRatings(p.name);return r.length?+((base+r.reduce((s,v)=>s+v,0)/r.length)/2).toFixed(1):+base.toFixed(1)}
function getPeerRatings(n){return peerRatings[n]?Object.values(peerRatings[n]):[]}
function getPeerRatingCount(n){return getPeerRatings(n).length}

async function dbGet(key){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/squad_data?key=eq.${key}&select=value`,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});const d=await r.json();return d&&d.length?JSON.parse(d[0].value):null;}catch(e){return null}}
async function dbSet(key,value){try{await fetch(`${SUPABASE_URL}/rest/v1/squad_data`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()})});}catch(e){console.warn('DB write failed',e)}}
async function saveAll(){await Promise.all([dbSet('players',players),dbSet('history',history),dbSet('peerRatings',peerRatings),dbSet('config',config)])}

function show(id){['screen-loading','screen-setup','screen-login','screen-main'].forEach(s=>{const el=document.getElementById(s);if(el)el.style.display='none';});document.getElementById(id).style.display='block';}

async function init(){
  try{
    const[cfg,pl,hist,ratings]=await Promise.all([dbGet('config'),dbGet('players'),dbGet('history'),dbGet('peerRatings')]);
    if(cfg)config=cfg;if(pl)players=pl;if(hist)history=hist;if(ratings)peerRatings=ratings;
    const ind=document.getElementById('db-indicator');if(ind){ind.textContent='● live';ind.className='db-pill db-ok';}
  }catch(e){const ind=document.getElementById('db-indicator');if(ind){ind.textContent='● offline';ind.className='db-pill db-err';}}
  if(!config.adminPin)show('screen-setup');else show('screen-login');
}

function setupPin(){const p1=document.getElementById('setup-pin1').value.trim(),p2=document.getElementById('setup-pin2').value.trim(),err=document.getElementById('setup-err');if(!p1||p1.length<4){err.textContent='PIN must be at least 4 characters.';return}if(p1!==p2){err.textContent='PINs do not match.';return}config={adminPin:p1,playerPins:{}};saveAll();show('screen-login');document.getElementById('login-pin').value='';document.getElementById('login-err').textContent='';}
function tryLogin(val){if(val.length<4)return;document.getElementById('login-err').textContent='';if(val===config.adminPin){loginAs('Admin','admin');return}const m=players.find(p=>config.playerPins[p.name]===val);if(m){loginAs(m.name,'player');return}document.getElementById('login-err').textContent='PIN not recognised.';}
function guestLogin(){loginAs('Guest','guest')}
function logout(){currentUser=null;currentRole=null;show('screen-login');document.getElementById('login-pin').value='';document.getElementById('login-err').textContent='';}
function loginAs(name,role){currentUser=name;currentRole=role;document.getElementById('user-badge').textContent=name+(role==='admin'?' (admin)':role==='guest'?' (guest)':'');buildTabs();show('screen-main');showTab('squad');}

function buildTabs(){const defs=[{id:'squad',label:'<i class="ti ti-users"></i> Squad'},{id:'session',label:'<i class="ti ti-calendar"></i> Session',adminOnly:true},{id:'teams',label:'<i class="ti ti-tournament"></i> Teams'},{id:'rate',label:'<i class="ti ti-star"></i> Rate',noGuest:true},{id:'history',label:'<i class="ti ti-history"></i> History'},{id:'leaderboard',label:'<i class="ti ti-trophy"></i> Board'},{id:'admin',label:'<i class="ti ti-settings"></i> Admin',adminOnly:true}];const tc=document.getElementById('main-tabs');tc.innerHTML='';defs.forEach(t=>{if(t.adminOnly&&currentRole!=='admin')return;if(t.noGuest&&currentRole==='guest')return;const b=document.createElement('button');b.className='tab';b.id='tb-'+t.id;b.innerHTML=t.label;b.onclick=()=>showTab(t.id);tc.appendChild(b);});}
function showTab(t){document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));const tb=document.getElementById('tb-'+t);if(tb)tb.classList.add('active');document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));const sec=document.getElementById('tab-'+t);if(sec)sec.classList.add('active');({squad:renderSquad,session:renderSession,teams:renderTeamsTab,rate:renderRateTab,history:renderHistory,leaderboard:renderLeaderboard,admin:renderAdmin})[t]?.();}

function buildPosRankUI(container,order){container.innerHTML='';order.forEach((key,i)=>{const info=POSITIONS.find(p=>p.key===key);const row=document.createElement('div');row.className='pos-item';row.innerHTML=`<span style="font-size:11px;font-weight:600;width:14px;color:#888">${i+1}</span><span style="font-size:13px;font-weight:600;width:36px">${key}</span><span style="font-size:11px;color:#888;flex:1">${info?.desc||''}</span><button class="parr" onclick="movePosUp('${key}')" ${i===0?'disabled':''} aria-label="Move up"><i class="ti ti-chevron-up"></i></button><button class="parr" onclick="movePosDown('${key}')" ${i===order.length-1?'disabled':''} aria-label="Move down"><i class="ti ti-chevron-down"></i></button>`;container.appendChild(row);});}
function movePosUp(key){const i=editPosOrder.indexOf(key);if(i>0){[editPosOrder[i-1],editPosOrder[i]]=[editPosOrder[i],editPosOrder[i-1]];buildPosRankUI(document.getElementById('pos-rank-edit'),editPosOrder)}}
function movePosDown(key){const i=editPosOrder.indexOf(key);if(i<editPosOrder.length-1){[editPosOrder[i],editPosOrder[i+1]]=[editPosOrder[i+1],editPosOrder[i]];buildPosRankUI(document.getElementById('pos-rank-edit'),editPosOrder)}}
function renderStyleTags(containerId,selected){selectedTags=[...selected];const container=document.getElementById(containerId);container.innerHTML='';STYLE_TAGS.forEach(tag=>{const btn=document.createElement('span');btn.className='style-tag-btn'+(selectedTags.includes(tag)?' on':'');btn.textContent=tag;btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();if(selectedTags.includes(tag)){selectedTags=selectedTags.filter(t=>t!==tag);btn.classList.remove('on');}else if(selectedTags.length<3){selectedTags.push(tag);btn.classList.add('on');}});container.appendChild(btn);});}
function buildSkillSliders(container,skills){container.innerHTML='';SKILLS.forEach(k=>{const v=skills[k]!==undefined?skills[k]:5;const row=document.createElement('div');row.className='skill-row';row.innerHTML=`<span class="skill-label">${k}</span><input type="range" min="1" max="10" step="1" value="${v}" style="flex:1" oninput="this.nextElementSibling.textContent=this.value"/><span class="skill-val">${v}</span>`;container.appendChild(row);});}

function renderSquad(){const isAdmin=currentRole==='admin';const sec=document.getElementById('tab-squad');sec.innerHTML=`${isAdmin?`<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="showAddForm(true)"><i class="ti ti-plus"></i> Add player</button></div>`:''}<div id="add-form" style="display:none" class="card"><h3 id="form-title">Add player</h3><div style="margin-bottom:12px"><input type="text" id="pname" placeholder="Player name"/></div><div style="font-size:12px;color:#666;margin-bottom:6px">Position preference — arrows to reorder (top = favourite)</div><div class="pos-list" id="pos-rank-edit"></div><div style="font-size:12px;color:#666;margin-bottom:8px">Style tags — pick up to 3</div><div id="style-tags-edit" style="margin-bottom:14px"></div><div style="font-size:12px;color:#666;margin-bottom:8px">Skills — rate relative to your group</div><div id="skill-sliders-edit"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary btn-sm" onclick="savePlayer()">Save player</button><button class="btn btn-sm" onclick="cancelForm()">Cancel</button></div></div><div id="player-grid" class="pgrid"></div>`;renderPlayerGrid();}
function showAddForm(isNew,idx){editingIdx=isNew?null:idx;document.getElementById('form-title').textContent=isNew?'Add player':'Edit player';const p=isNew?{name:'',positions:POSITIONS.map(p=>p.key),tags:[],skills:{}}:{...players[idx]};document.getElementById('pname').value=p.name||'';editPosOrder=p.positions?.length===4?[...p.positions]:[...POSITIONS.map(p=>p.key)];buildPosRankUI(document.getElementById('pos-rank-edit'),editPosOrder);renderStyleTags('style-tags-edit',p.tags||[]);buildSkillSliders(document.getElementById('skill-sliders-edit'),p.skills||{});document.getElementById('add-form').style.display='block';document.getElementById('pname').focus();}
function cancelForm(){document.getElementById('add-form').style.display='none';editingIdx=null;selectedTags=[];}
function savePlayer(){const name=document.getElementById('pname').value.trim();if(!name)return;const skills={};document.getElementById('skill-sliders-edit').querySelectorAll('input[type=range]').forEach((sl,i)=>skills[SKILLS[i]]=+sl.value);const isNew=editingIdx===null;const player={id:isNew?Date.now():players[editingIdx].id,name,positions:[...editPosOrder],tags:[...selectedTags],skills};if(isNew){players.push(player);if(!config.playerPins[name])config.playerPins[name]=genPin();}else{const old=players[editingIdx].name;if(old!==name&&config.playerPins[old]){config.playerPins[name]=config.playerPins[old];delete config.playerPins[old];}players[editingIdx]=player;}cancelForm();saveAll();renderPlayerGrid();}
function removePlayer(i){if(!confirm('Remove '+players[i].name+'?'))return;delete config.playerPins[players[i].name];players.splice(i,1);available=new Set([...available].filter(x=>x<players.length));saveAll();renderPlayerGrid();}
function renderPlayerGrid(){const g=document.getElementById('player-grid');if(!g)return;g.innerHTML='';const isAdmin=currentRole==='admin';if(!players.length){g.innerHTML='<p class="muted">No players yet.'+(isAdmin?' Add your squad above.':'')+'</p>';return}players.forEach((p,i)=>{const col=ACOLS[i%ACOLS.length];const ov=playerOverall(p);const pc=getPeerRatingCount(p.name);const card=document.createElement('div');card.className='pcard';card.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div class="avatar" style="background:${col}22;color:${col}">${initials(p.name)}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${p.name}</div><div style="font-size:11px;color:#666">Overall: <strong>${ov}</strong>${pc?` (${pc} peer rating${pc>1?'s':''})`:''}  · ${p.positions?.[0]||'?'}</div></div>${isAdmin?`<button class="btn btn-sm" onclick="showAddForm(false,${i})"><i class="ti ti-edit"></i></button><button class="btn btn-sm" onclick="removePlayer(${i})" style="margin-left:3px"><i class="ti ti-trash"></i></button>`:''}</div><div style="font-size:11px;color:#666;margin-bottom:6px">${(p.positions||[]).map((pos,ri)=>`<strong>${pos}</strong>${ri<p.positions.length-1?' › ':''}`).join('')}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">${(p.tags||[]).map(t=>`<span class="badge">${t}</span>`).join('')}</div>${SKILLS.map(k=>{const v=p.skills[k]!==undefined?p.skills[k]:5;return`<div class="skill-row"><span class="skill-label">${k}</span><div class="bar-bg" style="flex:1"><div class="bar-fill" style="width:${v*10}%;background:${col}"></div></div><span class="skill-val">${v}</span></div>`}).join('')}`;g.appendChild(card);});}

function renderSession(){const sec=document.getElementById('tab-session');sec.innerHTML=`<h3>This week's session</h3><div style="display:flex;gap:6px;margin-bottom:1rem"><button class="fmt-btn ${gameFormat===5?'active':''}" onclick="setFormat(5)">5-a-side</button><button class="fmt-btn ${gameFormat===6?'active':''}" onclick="setFormat(6)">6-a-side</button></div><p class="muted" id="session-info"></p><div id="avail-list"></div><div style="margin-top:1rem;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="generateTeams()"><i class="ti ti-tournament"></i> Generate teams</button><button class="btn btn-sm" onclick="selectAll()">Select all</button><button class="btn btn-sm" onclick="clearAll()">Clear all</button></div>`;renderAvailList();}
function setFormat(f){gameFormat=f;renderSession()}
function selectAll(){players.forEach((_,i)=>available.add(i));renderAvailList()}
function clearAll(){available.clear();renderAvailList()}
function toggleAvail(i){available.has(i)?available.delete(i):available.add(i);renderAvailList()}
function renderAvailList(){const info=document.getElementById('session-info'),list=document.getElementById('avail-list');if(!info||!list)return;const needed=gameFormat*2,sel=available.size;info.innerHTML=`${sel} selected — need <strong>${needed}</strong> for ${gameFormat}-a-side.`+(sel>needed?` <span style="color:#854f0b">${sel-needed} sub(s).</span>`:'');list.innerHTML='';players.forEach((p,i)=>{const row=document.createElement('div');row.className='avrow';row.innerHTML=`<input type="checkbox" id="av${i}" ${available.has(i)?'checked':''} style="cursor:pointer;width:16px;height:16px" onchange="toggleAvail(${i})"/><label for="av${i}" style="flex:1;cursor:pointer">${p.name}</label><span style="font-size:11px;color:#888;margin-right:6px">${p.positions?.[0]||''}</span><span class="badge">${playerOverall(p)}</span>`;list.appendChild(row);});}

function balanceTeams(pool){const half=Math.floor(pool.length/2);let bT1=[],bT2=[],bS=999;function combos(arr,k){const res=[];function h(s,c){if(c.length===k){res.push([...c]);return}for(let i=s;i<arr.length;i++){c.push(arr[i]);h(i+1,c);c.pop()}}h(0,[]);return res;}combos(pool.map((_,i)=>i),half).slice(0,500).forEach(combo=>{const t1=combo.map(i=>pool[i]),t2=pool.filter((_,i)=>!combo.includes(i));const o1=t1.reduce((s,p)=>s+playerOverall(p),0)/t1.length,o2=t2.reduce((s,p)=>s+playerOverall(p),0)/t2.length;const pd=POSITIONS.reduce((s,pos)=>s+Math.abs(t1.filter(p=>p.positions?.[0]===pos.key).length-t2.filter(p=>p.positions?.[0]===pos.key).length),0);const score=Math.abs(o1-o2)*3+pd*0.5;if(score<bS){bS=score;bT1=t1;bT2=t2}});return[bT1,bT2];}
function generateTeams(){const avp=players.filter((_,i)=>available.has(i));if(avp.length<4){alert('Select at least 4 players.');return}const needed=gameFormat*2;const sorted=[...avp].sort((a,b)=>playerOverall(b)-playerOverall(a));const main=sorted.slice(0,Math.min(needed,sorted.length));const[t1,t2]=balanceTeams(main);pendingTeams={t1,t2,subs:sorted.slice(main.length),date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};showTab('teams');}
function renderTeamsTab(){const sec=document.getElementById('tab-teams');if(!pendingTeams){sec.innerHTML='<p class="muted">Generate teams from the Session tab first.</p>';return}const{t1,t2,subs}=pendingTeams;const o1=t1.reduce((s,p)=>s+playerOverall(p),0)/t1.length;const o2=t2.reduce((s,p)=>s+playerOverall(p),0)/t2.length;const diff=Math.abs(o1-o2).toFixed(1);const pct=Math.round((o1/Math.max(o1,o2))*100);const bal=+diff<=0.4?'<span style="color:#0f6e56">✓ Very balanced</span>':+diff<=1.2?'<span style="color:#854f0b">⚠ Slightly uneven</span>':'<span style="color:#c0392b">✗ Uneven</span>';const posR=t=>POSITIONS.map(({key})=>{const c=t.filter(p=>p.positions?.[0]===key).length;return c?`<span class="badge" style="margin-right:3px">${key}×${c}</span>`:''}).join('');const tagR=t=>[...new Set(t.flatMap(p=>p.tags||[]))].map(t=>`<span class="badge" style="margin-right:3px">${t}</span>`).join('');const isAdmin=currentRole==='admin';sec.innerHTML=`<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="aiAnalysis()">AI analysis ↗</button>${isAdmin?`<button class="btn btn-sm" onclick="reshuffle()"><i class="ti ti-refresh"></i> Reshuffle</button><button class="btn btn-sm" onclick="saveToHistory()"><i class="ti ti-device-floppy"></i> Log match</button>`:''}</div><div class="tdisplay"><div class="tcard"><div class="tlabel" style="color:#185FA5">Team 1 — avg ${o1.toFixed(1)}</div>${t1.map(p=>`<div class="tpr"><span>${p.name}</span><span style="font-size:11px;color:#888">${p.positions?.[0]||''}</span><span class="badge">${playerOverall(p)}</span></div>`).join('')}<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">${posR(t1)}</div><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">${tagR(t1)}</div></div><div class="tcard"><div class="tlabel" style="color:#0F6E56">Team 2 — avg ${o2.toFixed(1)}</div>${t2.map(p=>`<div class="tpr"><span>${p.name}</span><span style="font-size:11px;color:#888">${p.positions?.[0]||''}</span><span class="badge">${playerOverall(p)}</span></div>`).join('')}<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">${posR(t2)}</div><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">${tagR(t2)}</div></div></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:8px"><span>Team 1</span><span>Team 2</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:#378ADD"></div></div><div style="font-size:12px;color:#666;margin-top:4px">Rating gap: <strong>${diff}</strong> — ${bal}</div>${subs.length?`<div class="divider"></div><div style="font-size:13px;font-weight:600;margin-bottom:6px">Substitutes</div><div style="display:flex;gap:6px;flex-wrap:wrap">${subs.map(p=>`<span class="badge">${p.name} (${playerOverall(p)})</span>`).join('')}</div>`:''}`;}
function aiAnalysis(){if(!pendingTeams)return;const{t1,t2}=pendingTeams;const o1=t1.reduce((s,p)=>s+playerOverall(p),0)/t1.length;const o2=t2.reduce((s,p)=>s+playerOverall(p),0)/t2.length;const msg=`Analyse these football teams and suggest specific player swaps to improve balance.\nTeam 1 (avg ${o1.toFixed(1)}): ${t1.map(p=>p.name+' ['+p.positions?.[0]+', '+(p.tags||[]).join('/')+', '+playerOverall(p)+']').join('; ')}\nTeam 2 (avg ${o2.toFixed(1)}): ${t2.map(p=>p.name+' ['+p.positions?.[0]+', '+(p.tags||[]).join('/')+', '+playerOverall(p)+']').join('; ')}`;alert('Copy this to Claude for AI analysis:\n\n'+msg);}
function reshuffle(){if(!pendingTeams)return;const avp=players.filter((_,i)=>available.has(i));const needed=gameFormat*2;const shuffled=[...avp].sort(()=>Math.random()-.5);const main=shuffled.slice(0,Math.min(needed,shuffled.length));const[t1,t2]=balanceTeams(main);pendingTeams={...pendingTeams,t1,t2,subs:shuffled.slice(main.length)};renderTeamsTab();}
function saveToHistory(){if(!pendingTeams)return;history.unshift({id:Date.now(),date:pendingTeams.date,format:gameFormat,t1:pendingTeams.t1.map(p=>p.name),t2:pendingTeams.t2.map(p=>p.name),subs:(pendingTeams.subs||[]).map(p=>p.name),score1:null,score2:null,stats:{},motm:null});saveAll();showTab('history');}

function renderRateTab(){const sec=document.getElementById('tab-rate');if(!players.length){sec.innerHTML='<h3>Rate players</h3><p class="muted">No players in the squad yet.</p>';return}sec.innerHTML='<h3>Rate players</h3><p class="muted">Rate everyone including yourself. Ratings are anonymous — only the averaged score is shown.</p><div id="rate-cards"></div>';const rc=document.getElementById('rate-cards');players.forEach(p=>{const existing=peerRatings[p.name]?.[currentUser]||{};const isSelf=p.name===currentUser;const card=document.createElement('div');card.className='card';card.innerHTML=`<div style="font-size:14px;font-weight:600;margin-bottom:10px">${p.name}${isSelf?' <span class="badge">you</span>':''}</div><div id="rsliders-${p.id}"></div><div style="display:flex;align-items:center;gap:10px;margin-top:8px"><button class="btn btn-primary btn-sm" onclick="submitRating('${p.name}',${p.id})">Save rating</button><span id="rsaved-${p.id}" style="font-size:12px;color:#0f6e56;display:none">✓ Saved</span></div>`;rc.appendChild(card);const sc=card.querySelector('#rsliders-'+p.id);SKILLS.forEach(k=>{const v=existing[k]||5;const row=document.createElement('div');row.className='skill-row';row.innerHTML=`<span class="skill-label">${k}</span><input type="range" min="1" max="10" step="1" value="${v}" style="flex:1" data-skill="${k}" data-pid="${p.id}" oninput="this.nextElementSibling.textContent=this.value"/><span class="skill-val">${v}</span>`;sc.appendChild(row);});}); }
function submitRating(playerName,pid){if(!peerRatings[playerName])peerRatings[playerName]={};const skills={};document.querySelectorAll(`[data-pid="${pid}"]`).forEach(sl=>skills[sl.dataset.skill]=+sl.value);peerRatings[playerName][currentUser]=+(Object.values(skills).reduce((s,v)=>s+v,0)/Object.values(skills).length).toFixed(1);saveAll();const el=document.getElementById('rsaved-'+pid);if(el){el.style.display='inline';setTimeout(()=>el.style.display='none',2000);}}

function renderHistory(){
  const sec=document.getElementById('tab-history');
  const canEdit=currentRole==='admin'||currentRole==='player';
  let html='<h3>Match history</h3>';
  if(canEdit){
    html+=`<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="showManualEntry()"><i class="ti ti-plus"></i> Log manual game</button></div>`;
    html+=`<div id="manual-entry" style="display:none" class="card">
      <h3>Log a game manually</h3>
      <div style="font-size:12px;color:#666;margin-bottom:6px">Date</div>
      <div style="margin-bottom:12px"><input type="date" id="manual-date" style="width:180px" value="${new Date().toISOString().slice(0,10)}"/></div>
      <div style="display:flex;gap:6px;margin-bottom:12px">
        <button class="fmt-btn ${gameFormat===5?'active':''}" onclick="setManualFormat(5)">5-a-side</button>
        <button class="fmt-btn ${gameFormat===6?'active':''}" onclick="setManualFormat(6)">6-a-side</button>
      </div>
      <div style="font-size:12px;color:#666;margin-bottom:8px">Tap each player to assign them to a team</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
        <div style="font-size:11px;font-weight:600;color:#185FA5;text-align:center">Team 1</div>
        <div style="font-size:11px;font-weight:600;color:#0F6E56;text-align:center">Team 2</div>
        <div style="font-size:11px;font-weight:600;color:#854f0b;text-align:center">Sub / N/A</div>
      </div>
      <div id="manual-player-list"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary btn-sm" onclick="saveManualGame()">Save game</button>
        <button class="btn btn-sm" onclick="hideManualEntry()">Cancel</button>
      </div>
    </div>`;
  }
  if(!history.length){html+='<p class="muted">No matches logged yet.</p>';sec.innerHTML=html;return;}
  history.forEach((entry,hi)=>{
    const all=[...entry.t1,...entry.t2,...(entry.subs||[])];
    const scoreHtml=entry.score1!==null?`<span style="font-size:20px;font-weight:700">${entry.score1} – ${entry.score2}</span>`:`<span style="font-size:13px;color:#888">No score</span>`;
    html+=`<div class="hcard"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-size:13px;font-weight:600">${entry.date} — ${entry.format}-a-side${entry.manual?' <span class="badge">manual</span>':''}</div><div style="font-size:12px;color:#666;margin-top:2px">T1: ${entry.t1.join(', ')}</div><div style="font-size:12px;color:#666">T2: ${entry.t2.join(', ')}</div>${entry.subs?.length?`<div style="font-size:12px;color:#666">Subs: ${entry.subs.join(', ')}</div>`:''}</div><div style="flex-shrink:0;margin-left:12px">${scoreHtml}</div></div><div class="divider" style="margin:.75rem 0"></div>${canEdit?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div><div style="font-size:11px;color:#666;margin-bottom:6px">Score</div><div style="display:flex;gap:6px;align-items:center"><input type="number" min="0" max="30" placeholder="T1" value="${entry.score1??''}" style="width:50px" oninput="updateScore(${hi},1,this.value)"/><span style="color:#888">–</span><input type="number" min="0" max="30" placeholder="T2" value="${entry.score2??''}" style="width:50px" oninput="updateScore(${hi},2,this.value)"/></div></div><div><div style="font-size:11px;color:#666;margin-bottom:6px">Man of the match</div><div style="display:flex;gap:4px;flex-wrap:wrap">${all.map(n=>`<button class="motm-btn ${entry.motm===n?'voted':''}" onclick="setMotm(${hi},${JSON.stringify(n)})">${n}</button>`).join('')}</div></div></div><div style="font-size:11px;color:#666;margin-bottom:6px">Goals &amp; assists</div>${all.map(n=>`<div class="srow"><span style="width:90px;flex-shrink:0">${n}</span><span style="font-size:11px;color:#666;margin-right:4px">Goals</span><input type="number" min="0" max="20" placeholder="0" value="${entry.stats[n]?.goals||''}" style="width:46px;margin-right:8px" oninput="updateStat(${hi},${JSON.stringify(n)},'goals',this.value)"/><span style="font-size:11px;color:#666;margin-right:4px">Assists</span><input type="number" min="0" max="20" placeholder="0" value="${entry.stats[n]?.assists||''}" style="width:46px" oninput="updateStat(${hi},${JSON.stringify(n)},'assists',this.value)"/></div>`).join('')}`:`<p class="muted" style="margin-bottom:0">Log in as a player to add stats.</p>`}<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${currentRole==='admin'?`<button class="btn btn-sm" style="color:#c0392b" onclick="deleteMatch(${hi})"><i class="ti ti-trash"></i> Delete</button>`:''}</div></div>`;
  });
  sec.innerHTML=html;
}

function showManualEntry(){
  document.getElementById('manual-entry').style.display='block';
  renderManualPlayerList();
}
function hideManualEntry(){document.getElementById('manual-entry').style.display='none';}
function setManualFormat(f){gameFormat=f;document.querySelectorAll('#manual-entry .fmt-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');renderManualPlayerList();}

function renderManualPlayerList(){
  manualT1=new Set();manualT2=new Set();manualSubs=new Set();
  const list=document.getElementById('manual-player-list');
  if(!list)return;
  list.innerHTML='';
  players.forEach(p=>{
    const row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center';
    row.id='mrow-'+p.id;
    row.innerHTML=`
      <button class="player-sel-btn" id="mb1-${p.id}" onclick="setManualTeam(${p.id},'t1')">${p.name}</button>
      <button class="player-sel-btn" id="mb2-${p.id}" onclick="setManualTeam(${p.id},'t2')">${p.name}</button>
      <button class="player-sel-btn" id="mbs-${p.id}" onclick="setManualTeam(${p.id},'sub')">${p.name}</button>`;
    list.appendChild(row);
  });
}

function setManualTeam(pid,team){
  const p=players.find(p=>p.id===pid);if(!p)return;
  manualT1.delete(pid);manualT2.delete(pid);manualSubs.delete(pid);
  if(team==='t1')manualT1.add(pid);
  else if(team==='t2')manualT2.add(pid);
  else manualSubs.add(pid);
  ['t1','t2','sub'].forEach(t=>{
    const btn=document.getElementById('mb'+(t==='t1'?'1':t==='t2'?'2':'s')+'-'+pid);
    if(btn){btn.className='player-sel-btn'+(team===t?' '+(t==='t1'?'t1':t==='t2'?'t2':'sub'):'');}
  });
}

function saveManualGame(){
  const t1=players.filter(p=>manualT1.has(p.id)).map(p=>p.name);
  const t2=players.filter(p=>manualT2.has(p.id)).map(p=>p.name);
  const subs=players.filter(p=>manualSubs.has(p.id)).map(p=>p.name);
  if(t1.length<1||t2.length<1){alert('Assign at least one player to each team.');return;}
  const dateVal=document.getElementById('manual-date').value;
  const date=dateVal?new Date(dateVal).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  history.unshift({id:Date.now(),date,format:gameFormat,t1,t2,subs,score1:null,score2:null,stats:{},motm:null,manual:true});
  saveAll();hideManualEntry();renderHistory();
}

function updateScore(hi,t,v){if(t===1)history[hi].score1=v===''?null:+v;else history[hi].score2=v===''?null:+v;saveAll();}
function updateStat(hi,n,k,v){if(!history[hi].stats[n])history[hi].stats[n]={};history[hi].stats[n][k]=v===''?0:+v;saveAll();}
function setMotm(hi,n){history[hi].motm=history[hi].motm===n?null:n;saveAll();renderHistory();}
function deleteMatch(hi){if(confirm('Delete this match?')){history.splice(hi,1);saveAll();renderHistory();}}

function renderLeaderboard(){const sec=document.getElementById('tab-leaderboard');if(!history.length){sec.innerHTML='<h3>Season leaderboard</h3><p class="muted">No matches logged yet!</p>';return}const stats={};players.forEach(p=>{stats[p.name]={goals:0,assists:0,motm:0,wins:0,played:0}});history.forEach(entry=>{[...entry.t1,...entry.t2].forEach(n=>{if(!stats[n])stats[n]={goals:0,assists:0,motm:0,wins:0,played:0};stats[n].played++;if(entry.stats[n]){stats[n].goals+=(entry.stats[n].goals||0);stats[n].assists+=(entry.stats[n].assists||0);}});if(entry.motm&&stats[entry.motm])stats[entry.motm].motm++;if(entry.score1!==null&&entry.score2!==null){const t1w=entry.score1>entry.score2,t2w=entry.score2>entry.score1;entry.t1.forEach(n=>{if(stats[n]&&t1w)stats[n].wins++;});entry.t2.forEach(n=>{if(stats[n]&&t2w)stats[n].wins++;}); }});const tabs=[{key:'goals',label:'Goals'},{key:'assists',label:'Assists'},{key:'motm',label:'MOTM'},{key:'wins',label:'Wins'}];const activeTab=sec.dataset.tab||'goals';const sorted=Object.entries(stats).sort((a,b)=>b[1][activeTab]-a[1][activeTab]);const medals=['🥇','🥈','🥉'];sec.innerHTML=`<h3>Season leaderboard</h3><div style="display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap">${tabs.map(t=>`<button class="fmt-btn ${activeTab===t.key?'active':''}" onclick="setLbTab('${t.key}')">${t.label}</button>`).join('')}</div><div class="card" style="margin-bottom:0"><div style="display:flex;align-items:center;gap:10px;padding:4px 0 8px;border-bottom:1px solid #f0f0f0"><span style="width:20px"></span><span style="flex:1;font-size:11px;color:#888">Player</span>${tabs.map(t=>`<span style="width:44px;text-align:center;font-size:11px;color:#888">${t.label}</span>`).join('')}</div>${sorted.map(([name,s],i)=>{const col=ACOLS[players.findIndex(p=>p.name===name)%ACOLS.length]||'#888';return`<div class="lb-row"><span style="font-size:13px;width:20px;flex-shrink:0">${i<3?medals[i]:i+1}</span><div style="display:flex;align-items:center;gap:6px;flex:1"><div class="avatar" style="width:26px;height:26px;font-size:10px;background:${col}22;color:${col}">${initials(name)}</div><span style="font-size:13px;font-weight:${s[activeTab]>0?'600':'400'}">${name}</span></div>${tabs.map(t=>`<span style="width:44px;text-align:center;font-size:13px;${activeTab===t.key?'font-weight:600':'opacity:.4'}">${s[t.key]}</span>`).join('')}</div>`;}).join('')}</div><p class="muted" style="margin-top:.75rem">${history.length} match${history.length!==1?'es':''} played · ${history.filter(h=>h.score1!==null).length} with scores logged</p>`;sec.dataset.tab=activeTab;}
function setLbTab(k){const sec=document.getElementById('tab-leaderboard');sec.dataset.tab=k;renderLeaderboard();}

function renderAdmin(){const sec=document.getElementById('tab-admin');sec.innerHTML=`<h3>Admin panel</h3><div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:8px">Change admin PIN</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="password" id="new-admin-pin" placeholder="New PIN" style="width:140px"/><input type="password" id="new-admin-pin2" placeholder="Confirm PIN" style="width:140px"/><button class="btn btn-sm btn-primary" onclick="changeAdminPin()">Update PIN</button></div><div id="pin-change-msg" style="font-size:12px;min-height:18px;margin-top:6px"></div></div><div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:4px">Player PINs</div><p class="muted">Share each player's PIN with them individually.</p>${players.map(p=>`<div class="pin-row"><span>${p.name}</span><span class="pin-val">${config.playerPins[p.name]||'—'}</span></div>`).join('')}${!players.length?'<p class="muted">Add players first.</p>':''}</div><div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:4px">Storage</div><p class="muted">All data is saved to Supabase — persists across devices and refreshes.</p><button class="btn btn-sm" onclick="exportData()"><i class="ti ti-download"></i> Export backup JSON</button></div>`;}
function changeAdminPin(){const p1=document.getElementById('new-admin-pin').value.trim(),p2=document.getElementById('new-admin-pin2').value.trim(),msg=document.getElementById('pin-change-msg');if(!p1||p1.length<4){msg.style.color='#c0392b';msg.textContent='PIN must be at least 4 characters.';return}if(p1!==p2){msg.style.color='#c0392b';msg.textContent='PINs do not match.';return}config.adminPin=p1;saveAll();msg.style.color='#0f6e56';msg.textContent='Admin PIN updated.';document.getElementById('new-admin-pin').value='';document.getElementById('new-admin-pin2').value='';}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({players,history,peerRatings,config},null,2)],{type:'application/json'}));a.download='squad_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
init();
</script>
</body>
</html>
